"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
name = "Peter Shih"
email = "peter50216@gmail.com"

[ui]
default-command = "log"
diff-editor = ":builtin"

[templates]
draft_commit_description = '''
concat(
  description,
  surround(
    "\nJJ: This commit contains the following changes:\n", "",
    indent("JJ:     ", diff.summary()),
  ),
  surround(
    "\nJJ: This commit contains the following changes:\n", "",
    indent("JJ:     ", diff.stat(72)),
  ),
  "\n",
  "JJ: ignore-rest\n",
  diff.git(),
)
'''

[aliases]
tug = ["bookmark", "move", "--from", "heads(::@- & bookmarks())", "--to", "@-"]
# -b bookmarks(), NOT tracked_remote_bookmarks(): remote refs lag local rebases
# until push, so a second pre-push run re-rebases the stale remote copies and
# makes the whole forest divergent.
rebase-all = ["rebase", "-b", "bookmarks()", "-d", "trunk()", "--skip-emptied"]
push-all = ["git", "push", "-r", "bookmarks() & ~(conflicts()::)"]
